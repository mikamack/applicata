name: Applicata building exe

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'v0.9.0'
        required: true
        default: 'v0.9.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Release 0.9.0 early alpha'


permissions:
  contents: write
jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
         python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      continue-on-error: true
      run: |
        pytest

  build:
    strategy:
      matrix:
        os: ['windows-latest','ubuntu-latest']
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
    - uses: actions/checkout@v4  
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
         python-version: "3.10"
    - name: Install dependencies
      continue-on-error: true 
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Install requirements
      run: pip install -r requirements.txt
    - name: Pyinstaller work
      run: |
          pyinstaller main.spec
    - name: Generating artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.os }}
        path: dist/


  publish-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    - name: Assembling the pack
      run: |
        cp -r yaml artifacts/app-windows-latest/yaml
        cp -r templates artifacts/app-windows-latest/templates
        cp -r yaml artifacts/app-ubuntu-latest/yaml
        cp -r templates artifacts/app-ubuntu-latest/templates
        zip -r release.zip *
    - name: Create releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v0.9.0 release.zip \
          --title "Release v0.9.0" \
          --notes "Release 0.9.0 early alpha"
          --clobber



